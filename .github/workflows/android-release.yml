# Release workflow for the Android client in filebrowser-android/, from the
# snonux/fdroid template (docs/templates/release.yml there).
#
# The server's releases use vX.Y.Z tags, so the app uses android-vX.Y.Z. A
# pushed android-vX.Y.Z tag, or a manual run with tag=android-vX.Y.Z, builds
# the per-ABI release APKs with the app's release key and attaches them to
# that tag's GitHub release as filebrowser-android-vX.Y.Z-<abi>.apk.
# snonux/fdroid serves them from there.
#
# The manual run creates the tag when it is missing, so a release needs no
# hand-pushed tag: start it on master once the version bump is there.
#
# Secrets: ANDROID_KEYSTORE (base64 of the keystore), ANDROID_KEY_ALIAS,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD; FDROID_DISPATCH_TOKEN is
# optional.
name: Android release

on:
  push:
    tags: ['android-v*']
  # Build a tag. If it does not exist yet, it is first created at the head of
  # the branch the run is started on (master for a release), once
  # filebrowser-android/pubspec.yaml there has the same version: agents release
  # this way, as their git proxy refuses tag pushes. An existing tag is
  # rebuilt, e.g. after fixing a secret, and is never moved.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build or create, e.g. android-v0.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: android-release-${{ inputs.tag || github.ref_name }}

env:
  APP_NAME: filebrowser    # asset prefix, matches apps.yml in snonux/fdroid
  APP_DIR: filebrowser-android
  FLUTTER_VERSION: 3.47.5  # used when APP_DIR has no .flutter-version
  TAG: ${{ inputs.tag || github.ref_name }}
  FDROID_DISPATCH_TOKEN: ${{ secrets.FDROID_DISPATCH_TOKEN }}

jobs:
  apk:
    name: Signed APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      # Runs before the checkout, which needs the tag to exist, so it reads
      # pubspec.yaml through the API and overrides the job's working directory,
      # which is not there yet. A pushed tag skips it. A tag created with the
      # workflow's own token does not start the tag-push trigger, so there is
      # one build. See docs/releasing-apps.md in snonux/fdroid, "Auto release
      # tagging"; the step name is grepped for there, so keep it. The step
      # is that template's, with the android-v prefix. Its shell has no
      # pipefail, so a failed fetch leaves version empty; without the check
      # for that, tag=android-v would create a junk tag.
      - name: Create the tag if it does not exist yet
        if: github.event_name == 'workflow_dispatch'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG exists, rebuilding it"; exit 0
          fi
          pubspec="${APP_DIR#./}/pubspec.yaml"; pubspec="${pubspec#./}"
          version=$(gh api "repos/$GITHUB_REPOSITORY/contents/$pubspec?ref=$GITHUB_SHA" \
            -H 'Accept: application/vnd.github.raw' | sed -n 's/^version: *\([^+]*\).*/\1/p')
          [ -n "$version" ] || { echo "::error::Could not read the version from $pubspec at $GITHUB_SHA"; exit 1; }
          if [ "android-v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match version $version in $pubspec"; exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" >/dev/null
          echo "Created $TAG at $GITHUB_SHA"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: The tag matches pubspec.yaml
        id: version
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          if [ "android-v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match version $version in $APP_DIR/pubspec.yaml"
            exit 1
          fi
          if [ -s .flutter-version ]; then
            echo "flutter=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"
          else
            echo "flutter=$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.version.outputs.flutter }}
          channel: stable
          cache: true

      - name: Restore the release key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ] || [ -z "$ANDROID_KEY_ALIAS" ] || \
             [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::The ANDROID_* signing secrets are not all set"
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE" | base64 -d > "$keystore"
          chmod 600 "$keystore"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$keystore" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
            > android/key.properties
          chmod 600 android/key.properties

      - name: flutter build apk --split-per-abi
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Signed with the release key, not the debug key
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            certs=$("$apksigner" verify --print-certs "$apk")
            echo "$apk: $certs"
            if echo "$certs" | grep -q 'CN=Android Debug'; then
              echo "::error::$apk is signed with the debug key"
              exit 1
            fi
          done

      # A release written by hand before the tag was pushed keeps its notes.
      - name: Attach the APKs to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apks=()
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$apk" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$apk" "$APP_NAME-$TAG-$abi.apk"
            apks+=("$APP_NAME-$TAG-$abi.apk")
          done
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "${apks[@]}"

      - name: Refresh the F-Droid repo now
        if: env.FDROID_DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.FDROID_DISPATCH_TOKEN }}
        run: gh api repos/snonux/fdroid/dispatches -f event_type=app-release

      - name: Forget the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/key.properties
