# Release workflow for the Android client in filebrowser-android/, from the
# snonux/fdroid template (docs/templates/release.yml there). Move it to
# .github/workflows/ to enable it; an agent's token cannot write there.
#
# The server's releases use vX.Y.Z tags, so the app uses android-vX.Y.Z. A
# pushed android-vX.Y.Z tag builds the per-ABI release APKs with the app's
# release key and attaches them to that tag's GitHub release as
# filebrowser-android-vX.Y.Z-<abi>.apk. snonux/fdroid serves them from there.
#
# Secrets: ANDROID_KEYSTORE (base64 of the keystore), ANDROID_KEY_ALIAS,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD; FDROID_DISPATCH_TOKEN is
# optional.
name: Android release

on:
  push:
    tags: ['android-v*']
  # Rebuild the APKs of a tag that already exists, e.g. after fixing a secret.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. android-v0.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: android-release-${{ inputs.tag || github.ref_name }}

env:
  APP_NAME: filebrowser    # asset prefix, matches apps.yml in snonux/fdroid
  APP_DIR: filebrowser-android
  FLUTTER_VERSION: 3.47.5  # used when APP_DIR has no .flutter-version
  TAG: ${{ inputs.tag || github.ref_name }}
  FDROID_DISPATCH_TOKEN: ${{ secrets.FDROID_DISPATCH_TOKEN }}

jobs:
  apk:
    name: Signed APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: The tag matches pubspec.yaml
        id: version
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          if [ "android-v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match version $version in $APP_DIR/pubspec.yaml"
            exit 1
          fi
          if [ -s .flutter-version ]; then
            echo "flutter=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"
          else
            echo "flutter=$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.version.outputs.flutter }}
          channel: stable
          cache: true

      - name: Restore the release key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ] || [ -z "$ANDROID_KEY_ALIAS" ] || \
             [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::The ANDROID_* signing secrets are not all set"
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE" | base64 -d > "$keystore"
          chmod 600 "$keystore"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$keystore" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
            > android/key.properties
          chmod 600 android/key.properties

      - name: flutter build apk --split-per-abi
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Signed with the release key, not the debug key
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            certs=$("$apksigner" verify --print-certs "$apk")
            echo "$apk: $certs"
            if echo "$certs" | grep -q 'CN=Android Debug'; then
              echo "::error::$apk is signed with the debug key"
              exit 1
            fi
          done

      # A release written by hand before the tag was pushed keeps its notes.
      - name: Attach the APKs to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apks=()
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$apk" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$apk" "$APP_NAME-$TAG-$abi.apk"
            apks+=("$APP_NAME-$TAG-$abi.apk")
          done
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "${apks[@]}"

      - name: Refresh the F-Droid repo now
        if: env.FDROID_DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.FDROID_DISPATCH_TOKEN }}
        run: gh api repos/snonux/fdroid/dispatches -f event_type=app-release

      - name: Forget the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/key.properties
