# Sizes the Gradle daemon JVM (Kotlin compile, D8/R8, in-process AAPT2). These
# are ceilings, not reservations, but an idle daemon keeps whatever heap it grew
# to: with the previous -Xmx8G / 4G metaspace it sat at ~3.6 GB resident on the
# dev laptop between builds. The Kotlin compile daemon inherits these too.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
